<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>go-rpc 监控台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div><h1>go-rpc</h1><span>轻量级 RPC 监控台</span></div><div class="actions"><select id="interval"><option value="2000">2 秒</option><option selected value="5000">5 秒</option><option value="10000">10 秒</option></select><button id="refresh">立即刷新</button><span id="updated">尚未刷新</span></div></header>
<main>
<section><h2>服务发现</h2><div id="serviceSummary" class="summary"></div><table><thead><tr><th>服务</th><th>地址</th><th>权重</th><th>状态</th></tr></thead><tbody id="services"></tbody></table></section>
<section><h2>调用监控</h2><canvas id="chart" width="720" height="230"></canvas><div id="metrics" class="cards"></div></section>
<section><h2>连接池</h2><table><thead><tr><th>目标</th><th>活跃</th><th>空闲</th><th>容量</th><th>等待</th></tr></thead><tbody id="pools"></tbody></table></section>
<section><h2>客户端配置</h2><label>负载策略 <select id="selector"><option>random</option><option>roundrobin</option><option>weighted</option><option>hash</option></select></label><pre id="config"></pre></section>
</main><footer>所有数据来自内嵌 JSON API，无外部前端依赖。</footer><script src="/app.js"></script>
</body></html>
